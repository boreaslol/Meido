name: Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: vellum-macos-arm
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact: vellum-macos-intel
          - platform: ubuntu-22.04
            args: ""
            artifact: vellum-linux
          - platform: windows-latest
            args: ""
            artifact: vellum-windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux WebKit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tauriScript: npm run tauri
          uploadUpdaterJson: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/*.dmg
            src-tauri/target/**/*.app
            src-tauri/target/**/*.exe
            src-tauri/target/**/*.msi
            src-tauri/target/**/*.AppImage
            src-tauri/target/**/*.deb
